<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="{{tagline}}">
<title>{{title}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161b22'/%3E%3Ctext x='5' y='22' font-family='Menlo,monospace' font-size='15' font-weight='700' fill='%2339d353'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0d1117;--win:#161b22;--bd:#30363d;--tx:#e6edf3;--mu:#7d8590;--ac:#39d353;--fs:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none;z-index:0;display:none}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 16px}
.win{background:var(--win);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:0 16px 48px #0008}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--mu);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;background:#ff5f56}.dot:nth-child(2){background:#ffbd2e}.dot:nth-child(3){background:#27c93f}
.bar span{flex:1;text-align:center;margin-right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{padding:8px 14px 0;color:var(--mu)}
#term{height:min(70vh,620px);overflow-y:auto;padding:10px 14px 14px;cursor:text}
#out pre,.ln{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.mu{color:var(--mu)}.ac{color:var(--ac)}.er{color:#f85149}.b{font-weight:700}
.row{display:flex;flex-wrap:wrap}.row>b{min-width:11ch;color:var(--ac);font-weight:400}
table{border-collapse:collapse;margin:4px 0}td,th{padding:2px 12px 2px 0;text-align:left;vertical-align:top}th{color:var(--mu);font-weight:400}
.tag{color:var(--mu)}
.pl{display:flex;position:relative}.ps{color:var(--ac);white-space:pre}
#in{position:absolute;opacity:0;left:0;top:0;width:100%;height:100%;font:inherit;border:0;padding:0}
#mir{white-space:pre}
.cur{display:inline-block;width:.6em;height:1.15em;background:var(--tx);vertical-align:text-bottom;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hm{position:relative;margin:6px 0}.hm canvas{max-width:100%;height:auto;display:block}
.big{font-size:28px;color:var(--ac);font-weight:700}
#tip{position:fixed;pointer-events:none;background:#000c;border:1px solid var(--bd);padding:2px 6px;border-radius:4px;font-size:12px;display:none;z-index:9}
#out .asc{color:#26a641;white-space:pre;overflow-x:auto;word-break:normal;overflow-wrap:normal;tab-size:1;width:max-content;max-width:100%;line-height:1;font-size:9px}
.chips,.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.chips button{font:inherit;font-size:12px;color:var(--tx);background:var(--win);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;cursor:pointer}
.chips button:hover{border-color:var(--ac);color:var(--ac)}
footer{margin-top:18px;text-align:center;color:var(--mu);font-size:12px}
@media (max-width:480px){:root{--fs:13px}main{padding:0}.win{border-radius:0;border-left:0;border-right:0}#term{height:60vh}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
<div class="win" role="application" aria-label="interactive terminal">
<div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>{{prompt}} — interactive terminal</span></div>
<div class="sub">{{tagline}}</div>
<div id="term">
<div id="out" aria-live="polite"></div>
<div class="pl" id="pl"><span class="ps">{{prompt}}:~$ </span><span id="mir"></span><span class="cur"></span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command"></div>
</div>
</div>
<nav class="chips" id="chips"></nav>
<nav class="links" id="links"></nav>
<footer>rendered client-side, no build step · data refreshes daily</footer>
</main>
<div id="tip"></div>
<script>
{{{data}}}
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const out = $("#out"), term = $("#term"), inp = $("#in"), mir = $("#mir"), pl = $("#pl"), tip = $("#tip");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const P = CFG.prompt;
function escapeHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
const E = escapeHtml, sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const safeUrl = (u) => (/^(https?:|mailto:)/i.test(u || "") ? u : "#");
const A = (u, t) => `<a href="${E(safeUrl(u))}" target="_blank" rel="noopener">${E(t)}</a>`;
const scroll = () => { term.scrollTop = term.scrollHeight; };
const add = (html, cls) => { const d = document.createElement("div"); d.className = "ln " + (cls || ""); d.innerHTML = html; out.appendChild(d); scroll(); return d; };
let job = 0, onCancel = null; // bump to cancel running animations (mascot, typing)
const cancel = () => { job++; const f = onCancel; onCancel = null; if (f) f(); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day = (i) => { const d = new Date(DATA.start + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + i); return d; };
const fmt = (d) => `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`;
const fmtISO = (s) => fmt(new Date(s + "T00:00:00Z"));
const streakText = () => DATA.streak.current ? `${DATA.streak.current}d streak` : `longest streak ${DATA.streak.longest}d`;
const row = (k, v) => v ? `<div class="row"><b>${E(k)}</b><span>${v}</span></div>` : "";

const C = {
  help: { d: "list commands", f: () => add(Object.keys(C).filter((k) => !C[k].hide).map((k) => `<span class="ac">${E(k.padEnd(14))}</span><span class="mu">${E(C[k].d)}${C[k].al ? " (" + E(C[k].al.join(", ")) + ")" : ""}</span>`).join("\n") + `\n<span class="mu">keys: ↑/↓ history · Tab complete · Ctrl+L clear · Esc stop</span>`) },
  whoami: { d: "who is this", al: ["about"], f: () => add(`<span class="b">${E(CFG.name)}</span>${CFG.alias ? ` <span class="mu">aka ${E(CFG.alias)}</span>` : ""}` +
    row("role", E(CFG.role)) + row("about", E(CFG.tagline)) + row("location", E(CFG.location)) + row("site", CFG.site && A(CFG.siteHref, CFG.site))) },
  projects: { d: "featured repos · open <name>", al: ["ls"], f: () => {
    if (!CFG.projects.length) return add("no projects", "mu");
    add(`<table><tr><th>name</th><th>★</th><th>description</th><th>links</th></tr>${CFG.projects.map((p) =>
      `<tr><td class="ac">${E(p.name)}</td><td>${E(p.stars)}</td><td>${E(p.description)}<br><span class="tag">${p.tags.map((t) => "#" + E(t)).join(" ")}</span></td><td>${p.demo ? A(p.demo, "demo") + " · " : ""}${A(p.src, "source")}</td></tr>`).join("")}</table><span class="mu">open &lt;name&gt; to launch one</span>`);
  } },
  open: { d: "open a project", f: (a) => {
    const n = (a[0] || "").toLowerCase(), p = CFG.projects.find((x) => x.name.toLowerCase() === n) || CFG.projects.find((x) => n && x.name.toLowerCase().startsWith(n));
    if (!p) return add(`open: no project "${E(a[0] || "")}" · try projects`, "er");
    window.open(safeUrl(p.demo || p.src), "_blank", "noopener"); add(`opening ${A(p.demo || p.src, p.demo || p.src)}`);
  } },
  stack: { d: "tools of the trade", al: ["skills"], f: () => add(CFG.stack.map((s) => `<span class="ac">▸</span> ${E(s)}`).join("\n") || "—") },
  contributions: { d: "last-year heatmap", al: ["graph"], f: heat },
  streak: { d: "contribution streak", f: () => { if (!DATA) return add("no data", "mu"); const s = DATA.streak;
    add(row("current", s.current ? `${E(s.current)}d` : `0 → longest ${E(s.longest)}d`) + row("longest", `${E(s.longest)}d`) + row("best day", `${E(DATA.best.count)} on ${E(fmtISO(DATA.best.date))}`)); } },
  mascot: { d: "ascii portrait", al: ["photo"], f: mascot, hide: !FRAMES.length },
  neofetch: { d: "system info", f: () => { const p0 = CFG.projects[0];
    add(`<span class="ac b">${E(P)}</span>\n<span class="mu">${"-".repeat(P.length)}</span>` + row("Name", E(CFG.name)) + row("Role", E(CFG.role || CFG.tagline)) + row("Location", E(CFG.location)) +
      row("Building", p0 && E([p0.name, p0.tags[0]].filter(Boolean).join(" · "))) + row("Stack", E(CFG.stack.slice(0, 3).join(", "))) + row("Site", E(CFG.site)) + row("Commits", DATA && E(DATA.total + " this year"))); } },
  contact: { d: "get in touch", f: () => add(CFG.links.map(([k, u]) => row(k, A(u, u.replace(/^mailto:|^https?:\/\//, "")))).join("")) },
  matrix: { d: "toggle glyph rain", f: matrix },
  clear: { d: "clear screen", f: () => { out.innerHTML = ""; } },
  history: { d: "command history", f: () => add(hist.map((h, i) => `${String(i + 1).padStart(3)}  ${E(h)}`).join("\n") || "—", "mu") },
};
const ALIAS = {};
for (const k in C) for (const a of C[k].al || []) ALIAS[a] = k;
const NAMES = Object.keys(C).concat(Object.keys(ALIAS)).sort();

const hist = []; let hi = 0;
function echo(cmd) { add(`<span class="ac">${E(P)}:~$ </span>${E(cmd)}`); }
function run(line) {
  cancel();
  const raw = line.trim(); echo(line);
  if (!raw) return;
  hist.push(raw); hi = hist.length;
  const [c0, ...rest] = raw.split(/\s+/), c = c0.toLowerCase(), k = C[c] ? c : ALIAS[c];
  if (!k) return add(`command not found: ${E(c0)} · try help`, "er");
  try { C[k].f(rest); } catch (e) { add("error: " + E(e.message), "er"); }
}

// ---- contributions heatmap -------------------------------------------------
const GREENS = ["#21262d", "#0e4429", "#006d32", "#26a641", "#39d353"];
function heat() {
  if (!DATA || !DATA.levels) return add("no contribution data", "mu");
  const lv = String(DATA.levels), off = day(0).getUTCDay(), S = 11, G = 3, W = 53 * (S + G), H = 7 * (S + G);
  const box = add(`<div class="big">0</div><div class="hm"><canvas></canvas></div><span class="mu"># ${E(DATA.total)} contributions · ${E(streakText())} · best ${E(DATA.best.count)} on ${E(fmtISO(DATA.best.date))}</span>`);
  const cv = box.querySelector("canvas"), big = box.querySelector(".big"), dpr = devicePixelRatio || 1, x = cv.getContext("2d");
  cv.width = W * dpr; cv.height = (H + 6) * dpr; cv.style.width = W + "px"; x.scale(dpr, dpr);
  const cells = [];
  for (let i = 0; i < lv.length; i++) { const p = i + off; cells.push({ i, c: Math.floor(p / 7), r: p % 7, l: +lv[i] || 0 }); }
  const back = (t) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
  const draw = (t) => {
    x.clearRect(0, 0, W, H + 6);
    for (const k of cells) {
      const p = Math.min(1, Math.max(0, (t - (k.c + k.r) * 14) / 420)); if (p <= 0) continue;
      x.globalAlpha = Math.min(1, p * 2); x.fillStyle = GREENS[k.l];
      x.beginPath(); (x.roundRect || x.rect).call(x, k.c * (S + G), k.r * (S + G) - (1 - back(p)) * 14, S, S, 2); x.fill();
    }
    x.globalAlpha = 1;
  };
  const END = (53 + 7) * 14 + 420, my = job;
  if (RM) { draw(END); big.textContent = DATA.total.toLocaleString(); }
  else { const t0 = performance.now(); const f = (now) => { const t = now - t0; draw(Math.min(t, END));
    big.textContent = (t >= END ? DATA.total : Math.round(DATA.total * (1 - Math.pow(1 - t / END, 3)))).toLocaleString(); if (t < END && my === job) requestAnimationFrame(f); else { draw(END); big.textContent = DATA.total.toLocaleString(); } }; requestAnimationFrame(f); }
  cv.addEventListener("mousemove", (e) => {
    const b = cv.getBoundingClientRect(), sc = W / b.width, c = Math.floor((e.clientX - b.left) * sc / (S + G)), r = Math.floor((e.clientY - b.top) * sc / (S + G));
    const i = c * 7 + r - off;
    if (r < 7 && i >= 0 && i < lv.length) { const n = DATA.counts ? DATA.counts[i] : null; tip.textContent = `${n == null ? "level " + lv[i] : n + " contribution" + (n === 1 ? "" : "s")} on ${fmt(day(i))}, ${day(i).getUTCFullYear()}`;
      tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; } else tip.style.display = "none";
  });
  cv.addEventListener("mouseleave", () => { tip.style.display = "none"; });
}

// ---- mascot --------------------------------------------------------------
// Cell aspect is locked to the SVG's (ASCII.cellH / ASCII.cellW) using the *measured* glyph advance of whatever font rendered.
function fitAscii(el) {
  const pr = document.createElement("span");
  pr.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-size:100px"; pr.textContent = "M".repeat(100);
  el.appendChild(pr); const k = pr.getBoundingClientRect().width / 1e4; pr.remove(); // char width per px of font-size
  const cs = getComputedStyle(out), avail = out.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const fs = Math.min(11, Math.max(4.5, (avail / (ASCII.cols * k)) * 0.995));
  el.style.fontSize = fs.toFixed(2) + "px"; el.style.lineHeight = (fs * k * ASCII.cellH / ASCII.cellW).toFixed(3) + "px";
}
let fitT = 0;
addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(() => out.querySelectorAll(".asc").forEach(fitAscii), 120); });
function mascot() {
  if (!FRAMES.length) return add("no ascii portrait in this build", "mu");
  const pre = add("", "asc"); fitAscii(pre);
  if (RM) { pre.textContent = FRAMES[0].join("\n"); return scroll(); }
  // Rows reveal left→right one after another (like the README SVG); the next frame types over the previous one.
  const { rows, cols } = ASCII, K = FRAMES.length, ROW_MS = 60, HOLD = 2500, TYPE = rows * ROW_MS, SLOT = TYPE + HOLD;
  const blank = Array(rows).fill(" ".repeat(cols)), t0 = performance.now();
  let f = 0, last = "";
  const paint = (s) => { if (s !== last) pre.textContent = last = s; };
  const snap = () => { if (pre.isConnected) paint(FRAMES[f].join("\n")); };
  pre.textContent = blank.join("\n"); add("Esc or any command stops it", "mu");
  onCancel = snap;
  const tick = (now) => {
    if (onCancel !== snap || !pre.isConnected) return;
    const t = Math.max(0, now - t0), n = Math.floor(t / SLOT), e = t % SLOT; // rAF stamp may precede t0
    const fr = FRAMES[(f = n % K)], prev = n ? FRAMES[(n - 1) % K] : blank;
    const r = Math.floor(e / ROW_MS), c = Math.floor(((e % ROW_MS) / ROW_MS) * cols);
    paint(r >= rows ? fr.join("\n") : fr.map((l, i) => (i < r ? l : i > r ? prev[i] : l.slice(0, c) + "█" + prev[i].slice(c + 1))).join("\n"));
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick); scroll();
}

// ---- matrix rain ---------------------------------------------------------
let rainOn = false, rainRaf = 0;
function matrix() {
  if (RM) return add("matrix disabled (prefers-reduced-motion)", "mu");
  const cv = $("#rain"), x = cv.getContext("2d"), RAMP = ".:-=+*#%@";
  rainOn = !rainOn; cv.style.display = rainOn ? "block" : "none"; cancelAnimationFrame(rainRaf);
  add(`matrix ${rainOn ? "on" : "off"}`, "mu"); if (!rainOn) return;
  const fs = 14; let w, h, drops, last = 0;
  const size = () => { w = cv.width = innerWidth; h = cv.height = innerHeight; drops = Array.from({ length: Math.ceil(w / fs) }, () => Math.random() * h / fs); };
  size(); addEventListener("resize", size);
  const tick = (now) => { if (!rainOn) return; rainRaf = requestAnimationFrame(tick); if (now - last < 50) return; last = now;
    x.fillStyle = "rgba(13,17,23,.12)"; x.fillRect(0, 0, w, h); x.fillStyle = "#39d353"; x.font = fs + "px ui-monospace,Menlo,monospace";
    drops.forEach((y, i) => { x.fillText(RAMP[(Math.random() * RAMP.length) | 0], i * fs, y * fs); drops[i] = y * fs > h && Math.random() > .975 ? 0 : y + 1; }); };
  rainRaf = requestAnimationFrame(tick);
}

// ---- input ----------------------------------------------------------------
const sync = () => { mir.textContent = inp.value; };
inp.addEventListener("input", sync);
inp.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const v = inp.value; inp.value = ""; sync(); run(v); }
  else if (e.key === "ArrowUp") { if (hi > 0) inp.value = hist[--hi]; sync(); e.preventDefault(); }
  else if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ""; sync(); e.preventDefault(); }
  else if (e.key === "Tab") { e.preventDefault(); const v = inp.value.toLowerCase(), m = NAMES.filter((n) => n.startsWith(v));
    if (m.length === 1) inp.value = m[0] + " "; else if (m.length > 1) { echo(inp.value); add(m.join("  "), "mu"); } sync(); }
  else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); cancel(); out.innerHTML = ""; }
});
addEventListener("keydown", (e) => { if (e.key === "Escape") cancel(); });
term.addEventListener("click", () => { if (!getSelection().toString()) inp.focus({ preventScroll: true }); });

$("#chips").innerHTML = ["help", "whoami", "projects", "contributions", "streak", "mascot", "matrix"].filter((c) => !C[c].hide).map((c) => `<button type="button" data-c="${c}">${c}</button>`).join("");
$("#chips").addEventListener("click", (e) => { const c = e.target.dataset && e.target.dataset.c; if (c) { run(c); } });
$("#links").innerHTML = CFG.links.map(([k, u]) => A(u, k)).join(" · ");

// ---- boot -----------------------------------------------------------------
const live = fetch(LIVE_DATA_URL, { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((j) => {
  if (j && Array.isArray(j.counts)) { DATA = { ...DATA, ...j }; return `data: live (${String(j.fetched || "").slice(0, 10) || "unknown"})`; }
  return "data: snapshot";
}).catch(() => "data: snapshot");
(async () => {
  if (matchMedia("(pointer: fine)").matches) inp.focus();
  const my = ++job;
  if (!RM) { for (const ch of "whoami") { mir.textContent += ch; await sleep(35); if (my !== job) { sync(); return; } } await sleep(200); }
  mir.textContent = ""; run("whoami");
  add(`type help · try contributions, projects${FRAMES.length ? " or mascot" : ""}`, "mu");
  // Deep link: ?cmd=<name> runs a known, visible command (no args); anything else is ignored.
  const deep = String(new URLSearchParams(location.search).get("cmd") || "").trim().toLowerCase();
  const dk = C[deep] ? deep : ALIAS[deep];
  if (dk && !C[dk].hide) run(deep);
  const msg = await Promise.race([live, sleep(6000).then(() => "data: snapshot")]);
  add(E(msg), "mu");
})();
})();
</script>
</body>
</html>
